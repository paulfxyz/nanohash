<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nanohash brand card</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; } body { margin: 0; background: #f5f5ed; color: #20291f; font-family: Satoshi, sans-serif; }
    .canvas { width: 1280px; height: 640px; padding: 64px 72px; display: flex; flex-direction: column; justify-content: space-between; }
    .top, .bottom { display: flex; align-items: center; justify-content: space-between; }
    .top { font: 500 14px "IBM Plex Mono", monospace; letter-spacing: .06em; color: #586450; }
    .mark { display: flex; align-items: center; gap: 24px; }
    .mark svg { width: 76px; height: 76px; }
    .name { font-size: 98px; font-weight: 700; line-height: 1; letter-spacing: -.065em; }
    h1 { font-size: 52px; letter-spacing: -.04em; line-height: 1.16; margin: 32px 0 0; font-weight: 500; }
    .green { color: #354b32; }
    .bottom { border-top: 1px solid #ccd0c4; padding-top: 24px; font: 400 15px "IBM Plex Mono", monospace; color: #586450; }
    .art { display: flex; justify-content: space-between; align-items: center; }
    .codes { display: grid; gap: 12px; transform: rotate(-5deg); }
    .code { background: #e6ebdf; padding: 14px 22px; font: 500 27px "IBM Plex Mono", monospace; border: 1px solid #cbd3c0; color: #354b32; }
    .code:nth-child(2) { margin-left: 36px; background: #354b32; color: #f5f5ed; }
    .code:nth-child(3) { margin-left: 72px; }
  </style>
</head>
<body><main class="canvas">
  <div class="top"><span>JAVASCRIPT / TYPESCRIPT</span><span>OPEN SOURCE · MIT</span></div>
  <div class="art"><div><div class="mark">
    <svg viewBox="0 0 64 64" fill="none" role="img" aria-label="nanohash logo"><path d="M27 10 17 54M46 10 36 54M11 25h43M8 41h43" stroke="#354b32" stroke-width="6"/></svg>
    <span class="name">nanohash<span class="green">.</span></span>
  </div><h1>Small codes.<br><span class="green">Clear trade-offs.</span></h1></div>
  <div class="codes" aria-label="Illustrative code lengths"><span class="code">k4m8</span><span class="code">h4sh25x9</span><span class="code">x7k9m2p4r8t3</span></div></div>
  <div class="bottom"><span>4–15 CHARACTERS · SECURE RANDOMNESS · HONEST SIZING</span><span>paulfxyz/nanohash</span></div>
</main></body></html>
